# 正式 QLoRA 训练配置草案（尚未执行训练）
#
# Qwen/Qwen3-8B
# Runtime: Ubuntu 22.04, Python 3.12, PyTorch 2.7.1+cu126,
# LlamaFactory 0.9.5, bitsandbytes 0.49.2, RTX 4090 24GB.
#
# 数据集：datasets/customer-service-train-640.json（640 条）
#         datasets/customer-service-validation-80.json（80 条，仅用于验证）
# 严禁使用：datasets/customer-service-test-80.json
#         该文件已在 dataset_info.json 中注册，仅供离线评测脚本加载，
#         不得出现在本文件的 dataset / eval_dataset 字段中。
#
# 输出目录与 Smoke 产物完全分离：
#   Smoke:      /workspace/training-artifacts/qwen3-8b/customer-service-smoke
#   Production: /workspace/training-artifacts/qwen3-8b/customer-service-production-v1
# overwrite_output_dir 保持 false，避免误覆盖既有 checkpoint。

### model
# 基础模型必须与 Adapter 绑定的 revision 完全一致，训练前先核验：
#   cd /workspace/models/Qwen3-8B && git rev-parse HEAD
#   期望：b968826d9c46dd6066d109eabc6255188de91218
# revision 不一致时不得开训：Tokenizer 或 chat template 变化会让 Adapter 失配。
model_name_or_path: /workspace/models/Qwen3-8B
model_revision: b968826d9c46dd6066d109eabc6255188de91218
trust_remote_code: true
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
# 数据集版本绑定（customer-service-2026-07-v1，随机种子 20260729）：
#   train      640 条  sha256 76464f6b2da0be60d30e796d566e80f7c5fb3597d61020c5c36d49a841e4d5e7
#   validation  80 条  sha256 d8cbcf9a0cbf303f1340b36594f66308ebaf4487650a605c509267bb8226c2e8
#   test        80 条  sha256 7baa23aec2e35c4744d2f2cf8bccf3b65b773f678d3244caf867551b8a8a8406
# 开训前用 shasum -a 256 datasets/customer-service-*.json 逐一核对；
# 不一致说明数据被改动，须重新跑 build + audit 后更新本文件。
#
# dataset_info.json 中三个正式数据集已配置 observation_tag: observation，
# 工具与知识库返回由 qwen3_nothink 的 format_observation 编码为 <tool_response>，
# 属于 source 段、label=IGNORE_INDEX，不计入损失。
dataset: customer_service_train_640
eval_dataset: customer_service_validation_80
dataset_dir: /workspace/qwen-customer-service-agent/datasets
template: qwen3_nothink
cutoff_len: 1536
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 0

### output
output_dir: /workspace/training-artifacts/qwen3-8b/customer-service-production-v1
logging_steps: 5
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
# 640 条 / (1 × 8) = 80 optimizer steps per epoch，3 epoch 共约 240 步。

### eval & best checkpoint
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 20
save_strategy: steps
save_steps: 20
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
