### model
model_name_or_path: C:/AI/models/Qwen3-4B-Instruct-2507
trust_remote_code: true
quantization_bit: 4
quantization_method: bnb

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

### dataset
dataset: customer_service_smoke_20
dataset_dir: Z:/AI/customer-service-ai/datasets
template: qwen3_nothink
cutoff_len: 1024
max_samples: 20
overwrite_cache: true
preprocessing_num_workers: 1
dataloader_num_workers: 0

### output
output_dir: C:/AI/adapters/qwen3-4b/customer-service-smoke
logging_steps: 1
save_steps: 5
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
