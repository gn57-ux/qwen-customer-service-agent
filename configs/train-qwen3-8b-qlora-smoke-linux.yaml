# Qwen/Qwen3-8B
# Hugging Face revision: b968826d9c46dd6066d109eabc6255188de91218
# Runtime: Ubuntu 22.04, Python 3.12, PyTorch 2.7.1+cu126,
# LlamaFactory 0.9.5, bitsandbytes 0.49.2, RTX 4090 24GB.

### model
model_name_or_path: /workspace/models/Qwen3-8B
trust_remote_code: true
quantization_bit: 4
quantization_method: bnb

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: customer_service_smoke_20
dataset_dir: /workspace/qwen-customer-service-agent/datasets
template: qwen3_nothink
cutoff_len: 1024
max_samples: 20
overwrite_cache: true
preprocessing_num_workers: 1
dataloader_num_workers: 0

### output
output_dir: /workspace/training-artifacts/qwen3-8b/customer-service-smoke
logging_steps: 1
save_steps: 5
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
